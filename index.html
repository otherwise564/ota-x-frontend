<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OTA X</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    /* =========================
       AUTH
    ========================= */

    #authScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      overflow-y: auto;
    }

    .authBox {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }

    .authLogo {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -4px;
      margin-bottom: 8px;
    }

    .authLogo span {
      color: #e50914;
    }

    .authSubtitle {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .authTabs {
      display: flex;
      background: #151515;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .authTab {
      flex: 1;
      padding: 12px;
      background: transparent;
      color: #aaa;
      border-radius: 9px;
      font-weight: 700;
    }

    .authTab.active {
      background: #e50914;
      color: #fff;
    }

    .authForm {
      display: none;
    }

    .authForm.active {
      display: block;
    }

    .authInput {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #292929;
      border-radius: 10px;
      background: #111;
      color: #fff;
      outline: none;
    }

    .authInput:focus {
      border-color: #e50914;
    }

    .authButton {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      background: #e50914;
      color: #fff;
      font-weight: 800;
      margin-top: 5px;
    }

    .authButton:disabled {
      opacity: .6;
    }

    #authMessage {
      min-height: 22px;
      margin-top: 15px;
      font-size: 13px;
    }

    /* =========================
       APP
    ========================= */

    #app {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
    }

    .topBar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 65px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.8),
        transparent
      );
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .logo span {
      color: #e50914;
    }

    .feedTabs {
      display: flex;
      gap: 20px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .feedTab {
      background: none;
      color: #aaa;
      font-weight: 700;
      font-size: 14px;
    }

    .feedTab.active {
      color: #fff;
    }

    .searchTop {
      background: rgba(255,255,255,.12);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 19px;
    }

    /* =========================
       FEED
    ========================= */

    .feed {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }

    .feed::-webkit-scrollbar {
      display: none;
    }

    .post {
      width: 100%;
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .videoBg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, #e50914, transparent 30%),
        radial-gradient(circle at 80% 70%, #450008, transparent 35%),
        linear-gradient(135deg, #080808, #260000);
    }

    .videoBg.two {
      background:
        radial-gradient(circle at 80% 20%, #ff3340, transparent 25%),
        radial-gradient(circle at 20% 80%, #300006, transparent 40%),
        linear-gradient(135deg, #000, #170000);
    }

    .videoBg.three {
      background:
        radial-gradient(circle at 50% 20%, #a0000b, transparent 30%),
        radial-gradient(circle at 50% 80%, #1d1d1d, transparent 40%),
        linear-gradient(135deg, #050505, #120000);
    }

    .videoCenter {
      position: relative;
      z-index: 1;
      text-align: center;
      opacity: .9;
    }

    .videoCenter .play {
      width: 75px;
      height: 75px;
      border: 2px solid rgba(255,255,255,.8);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-size: 30px;
      padding-left: 4px;
    }

    .videoCenter p {
      margin-top: 12px;
      font-size: 12px;
      color: #ddd;
    }

    .darkOverlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,.9),
        transparent 45%,
        rgba(0,0,0,.25)
      );
    }

    /* =========================
       ACTIONS
    ========================= */

    .actions {
      position: absolute;
      right: 12px;
      bottom: 115px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .action {
      background: none;
      color: #fff;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }

    .actionIcon {
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0,0,0,.3);
      font-size: 24px;
      margin-bottom: 4px;
    }

    .likeButton.liked .actionIcon {
      color: #e50914;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #e50914;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      border: 2px solid #fff;
    }

    .avatarWrap {
      position: relative;
    }

    .followPlus {
      position: absolute;
      bottom: -7px;
      right: -4px;
      background: #e50914;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    /* =========================
       POST INFO
    ========================= */

    .postInfo {
      position: absolute;
      left: 15px;
      right: 75px;
      bottom: 92px;
      z-index: 10;
    }

    .username {
      font-weight: 900;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .verified {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e50914;
      color: #000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
    }

    .caption {
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .sound {
      font-size: 12px;
      color: #ddd;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottomNav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 65px;
      z-index: 200;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(0,0,0,.88);
      border-top: 1px solid #202020;
    }

    .navItem {
      background: none;
      color: #aaa;
      font-size: 10px;
      min-width: 55px;
    }

    .navItem .navIcon {
      font-size: 21px;
      display: block;
      margin-bottom: 3px;
    }

    .navItem.active {
      color: #fff;
    }

    .createButton {
      width: 48px;
      height: 32px;
      border-radius: 9px;
      background: #fff;
      color: #000;
      font-size: 25px;
      line-height: 25px;
    }

    /* =========================
       SEARCH
    ========================= */

    .panel {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: #050505;
      display: none;
      overflow-y: auto;
    }

    .panel.active {
      display: block;
    }

    .panelHeader {
      height: 65px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 15px;
      border-bottom: 1px solid #222;
    }

    .backButton {
      background: none;
      color: #fff;
      font-size: 25px;
    }

    .searchInput {
      flex: 1;
      background: #151515;
      border: 1px solid #252525;
      color: #fff;
      border-radius: 10px;
      padding: 12px;
      outline: none;
    }

    .panelContent {
      padding: 20px;
    }

    .panelContent h2 {
      margin-bottom: 18px;
    }

    .trend {
      padding: 15px 0;
      border-bottom: 1px solid #1e1e1e;
    }

    .trend strong {
      display: block;
      margin-bottom: 5px;
    }

    .trend span {
      color: #888;
      font-size: 12px;
    }
