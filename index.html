<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTA X - TikTok Style Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Video Container with Duet / Overlay Support -->
    <div class="video-container">
        <video id="mainVideo" src="your-video.mp4" controls autoplay muted loop></video>
        <!-- Overlay video or image for story replies -->
        <div id="videoOverlay" class="overlay-container hidden">
            <img id="overlayMedia" src="" alt="Overlay Media">
        </div>
    </div>

    <!-- Comment Section -->
    <div class="comment-section">
        <h3>Comments</h3>
        <div id="commentsList" class="comments-list">
            <!-- Dynamic comments injected via JS -->
        </div>

        <!-- Comment Input Box with Media/Sticker Triggers -->
        <div class="comment-input-bar">
            <input type="text" id="commentInput" placeholder="Add comment...">
            
            <!-- Camera Icon for Photo/Video Replies -->
            <label for="mediaUpload" class="camera-btn" title="Reply with photo/video">
                📷
            </label>
            <input type="file" id="mediaUpload" accept="image/*,video/*" hidden>

            <!-- Sticker Picker Toggle -->
            <button id="stickerBtn" title="Add Sticker">😊</button>
            <button id="sendCommentBtn">Post</button>
        </div>

        <!-- Sticker Drawer -->
        <div id="stickerDrawer" class="sticker-drawer hidden">
            <span class="sticker" data-sticker="🔥">🔥</span>
            <span class="sticker" data-sticker="😂">😂</span>
            <span class="sticker" data-sticker="🦅">🦅</span>
            <span class="sticker" data-sticker="❤️">❤️</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
