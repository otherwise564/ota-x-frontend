<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTA X</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Tabs -->
    <div class="top-nav">
        <span class="nav-tab">Following</span>
        <span class="nav-tab active">For You</span>
    </div>

    <!-- Main Content Area -->
    <div class="main-feed">
        <div class="video-placeholder">
            <h2>OTA X</h2>
            <p>Connect, create and share your world.</p>
        </div>
        
        <!-- Right Side Action Buttons -->
        <div class="right-actions">
            <button class="action-btn">❤️ 12.4K</button>
            <button class="action-btn">💬 840</button>
            <button class="action-btn">↗️ Share</button>
            <button class="action-btn">⭐ Save</button>
        </div>

        <!-- Creator Info -->
        <div class="creator-info">
            <div class="avatar">O</div>
            <span class="username">@OTAcreator 🔴</span>
            <p class="caption">Welcome to OTA X — connect, create and share your world.</p>
        </div>
    </div>

    <!-- Bottom TikTok Navigation Bar -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <span>🏠</span>
            <small>Home</small>
        </a>
        <a href="#" class="nav-item">
            <span>👥</span>
            <small>Friends</small>
        </a>
        <a href="#" class="nav-item create-btn">
            <span>+</span>
        </a>
        <a href="#" class="nav-item">
            <span>💬</span>
            <small>Inbox</small>
        </a>
        <a href="#" class="nav-item">
            <span>👤</span>
            <small>Profile</small>
        </a>
    </div>

</body>
</html>
